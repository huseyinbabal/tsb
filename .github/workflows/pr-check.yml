name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  check:
    uses: huseyinbabal/rust-actions/.github/workflows/pr-check.yml@main
    with:
      # The nightly sync PR is bot-generated and has no issue to link
      check_issue_link: ${{ github.head_ref != 'chore/sync-initializr-metadata' }}
      run_tests: true
      run_fmt: true
      run_clippy: true
      run_security_scan: true
      check_coverage: true
